<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Resplandor amarillo de la bombilla -->
    <filter id="bulbAura" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo Morado Oscuro Oficial -->
  <rect width="64" height="64" rx="14" fill="#230b4d"/>

  <!-- Estrellas y destellos del fondo -->
  <!-- Estrellas moradas/lila -->
  <path d="M12 14 L13 16 L15 17 L13 18 L12 20 L11 18 L9 17 L11 16 Z" fill="#8d5fd3"/>
  <path d="M52 16 L53 18 L55 19 L53 20 L52 22 L51 20 L49 19 L51 18 Z" fill="#7547bd"/>
  <path d="M10 46 L11 48 L13 49 L11 50 L10 52 L9 50 L7 49 L9 48 Z" fill="#7547bd"/>
  <path d="M54 44 L55 46 L57 47 L55 48 L54 50 L53 48 L51 47 L53 46 Z" fill="#8d5fd3"/>
  <!-- Puntos y destellos amarillos -->
  <circle cx="48" cy="11" r="1.4" fill="#ffe97d"/>
  <circle cx="15" cy="40" r="1.2" fill="#ffe97d"/>
  <circle cx="50" cy="35" r="1.3" fill="#ffe97d"/>
  <circle cx="17" cy="54" r="1.2" fill="#ffe97d"/>

  <!-- Bombilla Amarilla Luminosa con halo -->
  <g filter="url(#bulbAura)">
    <!-- Halo exterior blanco/amarillo -->
    <path d="M32 12 C21.5 12 17 20 17 28 C17 34 22 38.5 24 45 L40 45 C42 38.5 47 34 47 28 C47 20 42.5 12 32 12 Z"
          fill="#ffdf59" stroke="#fff5b8" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Base de la bombilla (amarillo) -->
    <path d="M25 47 C25 47 26 53 32 53 C38 53 39 47 39 47 Z"
          fill="#ffcd36" stroke="#fff5b8" stroke-width="1.8"/>
  </g>

  <!-- Signo de Interrogación Blanco Oficial en el centro -->
  <g fill="#ffffff">
    <!-- Parte curva superior del signo -->
    <path d="M26.5 25 C26.5 21.2 29 18.5 32.5 18.5 C36 18.5 38.5 21 38.5 24.2 C38.5 27.2 36.5 29.2 34.5 31.2 C33.2 32.5 32.5 33.5 32.5 35.5 L31.5 35.5 C31.5 33 32.5 31.5 34 30 C35.8 28.2 37 26.6 37 24.2 C37 22 35 20.2 32.5 20.2 C29.8 20.2 28.2 22 28.2 25 Z"
          stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Punto inferior del signo -->
    <circle cx="32.5" cy="40" r="2.2" />
  </g>
</svg>
